name: Publish

# Triggered by publishing a GitHub Release, the same trigger
# CogentWizards/redundo uses for its own PyPI publish workflow. Cut the
# release and this does the rest. Two independent publish targets, npm
# and ClawHub, each gated on the
# build+test step passing first.
#
# npm publishing uses Trusted Publishing (OIDC), not a stored token: no
# NPM_TOKEN secret exists or is needed. GitHub mints a short-lived,
# workflow-scoped token for the publish-npm job below, and npm exchanges
# it for a real publish credential at publish time. This needs a one-time
# setup step outside this repo, on npmjs.com itself (Package settings ->
# Trusted Publisher -> GitHub Actions), naming this repository and this
# exact workflow filename, publish.yml. Same posture as
# CogentWizards/redundo's own PyPI publish, which uses PyPI's equivalent
# OIDC trusted publisher mechanism.
#
# ClawHub still needs a stored secret; it has no OIDC equivalent yet:
#   CLAWHUB_TOKEN   A ClawHub API token. Log in once yourself
#                   (`clawhub login`), then `clawhub token` prints the value
#                   to store here.
on:
  release:
    types: [published]

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build (src -> dist)
        run: npm run build

      - name: Test (src+test -> dist-test, node --test)
        run: npm test

      - name: Publish to npm
        run: npm publish

  publish-clawhub:
    name: Publish to ClawHub
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      # ClawHub packs its artifact from this checkout's own dist/ output,
      # not from a bare GitHub ref. dist/ is gitignored (a build
      # artifact), so publishing straight from a GitHub source ref instead
      # of a built local folder produces an artifact missing dist/ entirely
      # (confirmed the hard way: OpenClaw's installer failed with
      # "extension entry not found: ./dist/index.js" the first time this
      # was published that way). Build here for the same reason the npm
      # job does.
      - name: Install dependencies
        run: npm ci

      - name: Build (src -> dist)
        run: npm run build

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Log in to ClawHub
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-browser
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      # Deliberately no --wait: that flag drove a real ClawHub-side backend
      # out of memory the one time it was tried manually. The publish
      # itself (queued for automated security scanning) succeeds fine
      # without it; --wait just blocks the CLI on a synchronous check that
      # isn't needed here.
      #
      # RELEASE_NOTES goes through env:, not directly into the run: string.
      # Release bodies are freeform, attacker-controllable text (anyone
      # who can open a release on this repo controls this value), and
      # interpolating it straight into a shell command is a real script
      # injection vector in GitHub Actions.
      - name: Publish to ClawHub
        run: |
          clawhub package publish . \
            --family code-plugin \
            --owner cogentwizards \
            --name @cogentwizards/openclaw-localtrace \
            --source-repo CogentWizards/openclaw-localtrace \
            --source-commit "$GITHUB_SHA" \
            --changelog "$RELEASE_NOTES"
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
